{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
            
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-dark">Login</h2>
                        <p class="text-muted">Access your dashboard</p>
                    </div>

                    <form action="{% url 'login' %}" method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3 custom-form-group">
                            {{ form|crispy }}
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-warning btn-lg fw-bold shadow-sm py-3">
                                Login
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<style>
    /* Makes the actual input boxes taller and the text easier to read */
    .custom-form-group input {
        padding: 12px 15px !important;
        font-size: 1.1rem !important;
        border-radius: 8px !important;
    }
    /* Adds focus effect for better UX */
    .custom-form-group input:focus {
        border-color: #ffc107;
        box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
    }
</style>

{% endblock %}
