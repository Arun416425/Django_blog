<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: #343a40;
            line-height: 1;
        }

        .error-message {
            font-size: 1.5rem;
            color: #6c757d;
        }

        .btn-home {
            padding: 12px 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="container error-container text-center">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="error-code mb-0">404</h1>

                <h2 class="mb-3 mt-0">Oops! Page Not Found</h2>
                <p class="error-message mb-5">
                    The page you are looking for might have been removed,
                    had its name changed, or is temporarily unavailable.
                </p>

                <a href="/" class="btn btn-dark btn-home rounded-pill shadow-sm">
                    Back to Homepage
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
