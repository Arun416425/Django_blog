{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">Confirm Deletion</h5>
                </div>
                <div class="card-body text-center py-4">
                    <p class="fs-5">Are you sure you want to delete the category: <br>
                        <strong class="text-danger">"{{ category.category_name }}"</strong>?
                    </p>
                    <p class="text-muted small">This action cannot be undone.</p>

                    <form action="{% url 'delete_category' category.id %}" method="POST" class="mt-4">
                        {% csrf_token %}
                        <div class="d-grid gap-2 d-md-block">
                            <button type="submit" class="btn btn-danger px-4 me-md-2">Yes, Delete</button>
                            <a href="{% url 'categories' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
